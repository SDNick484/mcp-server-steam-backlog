[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-steam-backlog"
version = "0.1.0"
description = "MCP server for Steam Backlog Triage: what to play next, search and triage your Steam library"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SDNick484" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "steam", "steam-deck", "backlog", "howlongtobeat", "protondb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",  # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31,<1",        # the HTTP transport (remote.py)
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-steam-backlog"
Issues = "https://github.com/SDNick484/mcp-server-steam-backlog/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
mcp-server-steam-backlog = "steam_backlog_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steam_backlog_mcp = ["scoring.md", "sim/sample_library.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: runs against a real backlog_server.py checkout (BACKLOG_REF)"]

[tool.coverage.run]
source = ["steam_backlog_mcp"]
# Process-level entry points the tests drive as subprocesses (stdio, the HTTP service) aren't
# visible to in-process coverage; remote.serve_http is marked pragma: no cover upstream.
omit = [
    "*/steam_backlog_mcp/__main__.py",
    # Copied verbatim from steam-backlog-triage, tested there.
    "*/steam_backlog_mcp/backlog_query.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# Copied verbatim from steam-backlog-triage, linted and tested there.
extend-exclude = [
    "src/steam_backlog_mcp/backlog_query.py",
    ".github/scripts/privacy_scan.py",
    "tests/test_privacy_scan.py",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# Copied verbatim from steam-backlog-triage, linted and tested there.
module = "steam_backlog_mcp.backlog_query"
ignore_errors = true
