name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the shared-drift --latest check, plus a fresh run of everything against new
  # dependency releases and steam-backlog-triage's main.
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# One run per branch and event. A push to a PR branch cancels that PR's previous run; pushes to main
# and the weekly schedule queue instead, so a merge can't cancel the schedule's --latest check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, not a tag: a tag can be moved. The comment is the version the SHA
# was taken from; Dependabot (.github/dependabot.yml) bumps both together.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # The contract tests also run against a real backlog_server.py from steam-backlog-triage,
      # pinned to its main after PR #12 (CLAUDE.md and the pin). Bump it when the contract changes.
      BACKLOG_REF: 4d0b53c3c11d88e6afb5b513572d32d78ca9f24c
      BACKLOG_REQUIRE_REAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov
      - name: Score vectors still match backlog.html
        run: |
          # Fetch the pinned commit the way tests/conftest.py does. `git clone --branch` takes only a
          # branch or tag, and a fallback to main would compare against an unpinned page.
          git init -q /tmp/sbt
          git -C /tmp/sbt fetch -q --depth 1 https://github.com/SDNick484/steam-backlog-triage.git "$BACKLOG_REF"
          git -C /tmp/sbt checkout -q FETCH_HEAD
          node scripts/gen_score_vectors.mjs /tmp/sbt/backlog.html /tmp/vectors.json
          python - <<'PY'
          import json
          a = json.load(open("tests/fixtures/score_vectors.json"))
          b = json.load(open("/tmp/vectors.json"))
          assert a["source"]["functionsSha256"] == b["source"]["functionsSha256"], (
              "backlog.html's score() changed: regenerate tests/fixtures/score_vectors.json in both repos"
          )
          assert a["vectors"] == b["vectors"]
          print("score vectors match backlog.html")
          PY

  # No personal details in a public repo. Prints where and which rule, never the matched value.
  privacy-scan:
    name: Privacy scan (SteamIDs, IPs, emails, denylist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan files and commits
        env:
          # Newline-separated terms (hostnames, domain, names, device names). Not available to pull requests from
          # forks or to Dependabot; the scan then runs its pattern checks only and says so.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          HAVE_DENYLIST: ${{ secrets.PRIVACY_DENYLIST != '' }}
        run: |
          flag=""
          if [ "$HAVE_DENYLIST" = true ]; then
            flag="--require-denylist"
          else
            echo "::warning::PRIVACY_DENYLIST is not available to this run; only the pattern checks ran"
          fi
          python .github/scripts/privacy_scan.py $flag

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  # The command-line install on Alpine (musl), in a stock container: deploy/alpine/smoke-test.sh.
  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" -w /src python:3.12-alpine sh deploy/alpine/smoke-test.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/docker/Dockerfile -t mcp-server-steam-backlog .
      - run: docker run --rm --entrypoint mcp-server-steam-backlog mcp-server-steam-backlog --version

  # The files shared with the sibling servers (shared.lock lists which) must match mcp-server-shared.
  # The job itself lives in mcp-server-shared (.github/workflows/shared-drift.yml): it runs this
  # repo's own scripts/sync_shared.py, so the check is the one this repo's lock pins.
  shared-drift:
    uses: SDNick484/mcp-server-shared/.github/workflows/shared-drift.yml@5f9b824fb1ab1f5e8db1196980125355d5293a5a # v0.1.1

  # backlog_query.py is copied from steam-backlog-triage (query.lock records the commit); it must match.
  query-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: backlog_query.py matches the locked commit
        run: python scripts/sync_query.py --check --require-online
      - name: backlog_query.py matches steam-backlog-triage main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_query.py --check --latest --require-online
