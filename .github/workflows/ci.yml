name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the shared-drift --latest check, plus a fresh run of everything against new
  # dependency releases and steam-backlog-triage's main.
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # The contract tests also run against a real backlog_server.py from steam-backlog-triage,
      # pinned to its PR A merge commit (API 2). Bump it when the contract changes.
      BACKLOG_REF: c2bb1590868ba05460e761b51f5a1370e00a2b46
      BACKLOG_REQUIRE_REAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov
      - name: Score vectors still match backlog.html
        run: |
          git clone --depth 1 --branch "$BACKLOG_REF" https://github.com/SDNick484/steam-backlog-triage.git /tmp/sbt \
            || git clone https://github.com/SDNick484/steam-backlog-triage.git /tmp/sbt
          node scripts/gen_score_vectors.mjs /tmp/sbt/backlog.html /tmp/vectors.json
          python - <<'PY'
          import json
          a = json.load(open("tests/fixtures/score_vectors.json"))
          b = json.load(open("/tmp/vectors.json"))
          assert a["source"]["functionsSha256"] == b["source"]["functionsSha256"], (
              "backlog.html's score() changed: regenerate tests/fixtures/score_vectors.json in both repos"
          )
          assert a["vectors"] == b["vectors"]
          print("score vectors match backlog.html")
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  # The command-line install on Alpine (musl), in a stock container: deploy/alpine/smoke-test.sh.
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/src" -w /src python:3.12-alpine sh deploy/alpine/smoke-test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/docker/Dockerfile -t mcp-server-steam-backlog .
      - run: docker run --rm --entrypoint mcp-server-steam-backlog mcp-server-steam-backlog --version

  # The files shared with the sibling servers (shared.lock lists which) must match mcp-server-shared.
  shared-drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Shared files match the locked commit
        run: python scripts/sync_shared.py --check
      - name: Shared files match mcp-server-shared main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_shared.py --check --latest
